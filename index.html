<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Planes Gerenciales de la Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: imprenta — barra superior con marcas de registro CMYK, pestañas de módulo, contenido en rejilla de pliego */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#18202e; --ink-2:#4a5568; --rule:#dde1e8; --rule-2:#eceff3;
  --cyan:#0a8fb8; --cyan-soft:#e2f3f9; --magenta:#c2185b; --yellow:#e5a50a; --key:#18202e;
  --ok:#2f8a4f; --ok-soft:#e5f3ea; --warn:#b7791f; --warn-soft:#fbf1dc; --bad:#c53030; --bad-soft:#fbe5e5;
  --display:"Literata",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(24,32,46,.06),0 4px 14px rgba(24,32,46,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#181d26; --ink:#e8ebf0; --ink-2:#a3adbd; --rule:#2c3340; --rule-2:#232a35;
  --cyan:#3fb6dc; --cyan-soft:#16313c; --magenta:#e45a92; --yellow:#f0bd3a; --key:#e8ebf0;
  --ok:#5cc07d; --ok-soft:#1a3324; --warn:#e2a64a; --warn-soft:#3a2d16; --bad:#f07070; --bad-soft:#3d1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#181d26; --ink:#e8ebf0; --ink-2:#a3adbd; --rule:#2c3340; --rule-2:#232a35;
  --cyan:#3fb6dc; --cyan-soft:#16313c; --magenta:#e45a92; --yellow:#f0bd3a; --key:#e8ebf0;
  --ok:#5cc07d; --ok-soft:#1a3324; --warn:#e2a64a; --warn-soft:#3a2d16; --bad:#f07070; --bad-soft:#3d1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--sheet);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{color:var(--ink-2);font-size:.85rem}
.reg{display:flex;gap:4px;align-items:center}
.reg i{width:12px;height:12px;border-radius:50%;display:block}
.status{font-family:var(--mono);font-size:.75rem;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.on .dot{background:var(--ok)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:500 .9rem var(--body);color:var(--ink-2);background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cyan)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs .n{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);margin-left:6px}
main .wrap{padding-block:22px 48px;display:flex;flex-direction:column;gap:20px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar .left,.bar .right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0}
h3{font-family:var(--body);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
textarea{min-height:70px;resize:vertical}
.btn{font:500 .88rem var(--body);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:.78rem;color:var(--ink-2)}
.kpi .s{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--paper);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
tbody tr:hover{background:var(--rule-2)}
.pill{display:inline-block;font-size:.74rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--rule-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--cyan-soft);color:var(--cyan)}
.ex{font-family:var(--mono);font-size:.68rem;color:var(--magenta);border:1px solid var(--magenta);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.meter{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden;min-width:70px}
.meter b{display:block;height:100%;background:var(--cyan)}
.meter.over b{background:var(--bad)}
.unit-tag{font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
.org{display:flex;flex-direction:column;gap:2px}
.org .row{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 110px;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;font-size:.86rem}
.org .row:hover{background:var(--rule-2)}
.org .row.h{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.org .row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org .lvl1{padding-left:22px}.org .lvl2{padding-left:44px}
.org .t{font-family:var(--mono);font-size:.68rem;color:var(--ink-2);margin-right:6px}
.org .c{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.org .row{grid-template-columns:minmax(0,1fr) 40px 40px}.org .row>:nth-child(4){display:none}}
svg text{fill:var(--ink-2);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border-left:3px solid var(--warn);background:var(--warn-soft);font-size:.85rem}
.alert.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.alert b{font-weight:600}
dialog{border:1px solid var(--rule);border-radius:10px;padding:0;background:var(--sheet);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
dialog .hd{padding:16px 20px;border-bottom:1px solid var(--rule)}
dialog .bd{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
dialog .ft{padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
dialog label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:500;color:var(--ink-2);min-width:0}
dialog label.full{grid-column:1/-1}
@media (max-width:560px){dialog .bd{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100vw - 32px)}
.note{font-size:.8rem;color:var(--ink-2)}
.search{width:220px}
@media (max-width:560px){.search{width:100%}}
/* árbol consolidado de proyecto */
.uhead{display:flex;flex-direction:column;gap:4px}
.crumb{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}
.proj{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden;min-width:0}
.proj>.ph{padding:14px 16px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--rule)}
.proj>.ph .ttl{min-width:0;flex:1 1 260px}
.proj>.ph .ttl strong{font-family:var(--display);font-size:1.08rem}
.proj .nums{display:flex;gap:18px;flex-wrap:wrap}
.proj .nums div{display:flex;flex-direction:column;font-size:.72rem;color:var(--ink-2);gap:2px}
.proj .nums b{font-family:var(--mono);font-size:.9rem;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.tree{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule-2);font-size:.86rem}
.node:last-child{border-bottom:0}
.node .lbl{min-width:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node .kind{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2)}
.node.l1{padding-left:16px;background:var(--paper)}
.node.l2{padding-left:40px}
.node.l3{padding-left:64px}
.node.l1 .kind{border-color:var(--cyan);color:var(--cyan)}
.node.l3 .kind{border-color:var(--magenta);color:var(--magenta)}
.node .side{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.node .side .meter{width:80px}
.node .mono{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.adder{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--rule-2)}
.adder.l2{padding-left:40px}.adder.l3{padding-left:64px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--cyan);cursor:pointer;font-size:.8rem}
.link:hover{text-decoration:underline}
.metas{padding:12px 16px;background:var(--cyan-soft);display:flex;flex-direction:column;gap:8px}
.metas .m{display:grid;grid-template-columns:minmax(0,1fr) 120px 60px;gap:10px;align-items:center;font-size:.86rem}
@media (max-width:560px){.node.l2{padding-left:28px}.node.l3{padding-left:40px}.adder.l2{padding-left:28px}.adder.l3{padding-left:40px}.metas .m{grid-template-columns:minmax(0,1fr) 60px}.metas .m>:nth-child(2){display:none}.node{grid-template-columns:minmax(0,1fr)}.node .side{justify-content:flex-start}}
.org .row.click{cursor:pointer}
.org .row.sel{background:var(--cyan-soft)}
@media (prefers-reduced-motion:no-preference){.meter b{transition:width .4s ease}}
.vchart{position:relative;min-height:280px}
.vtip{position:absolute;pointer-events:none;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:6px 10px;font-size:.76rem;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.vtip .h{color:var(--ink-2);margin-bottom:2px}
.vtip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.v-lbl{display:flex;flex-direction:column;gap:5px}
.v-up{color:var(--ok)}.v-down{color:var(--bad)}
.vt{max-height:32rem;overflow:auto}
.vt th:first-child,.vt td:first-child{position:sticky;left:0;background:var(--sheet);z-index:1}
.vt thead th:first-child{background:var(--paper);z-index:2}
.vt tr.vtot td{font-weight:600;background:var(--paper)}
.vt td.num{font-size:.8rem}
.vbars{display:flex;flex-direction:column;gap:7px}
.vbar{display:grid;grid-template-columns:minmax(7rem,12rem) 1fr auto;gap:10px;align-items:center;font-size:.82rem}
.vbar .t{height:12px;background:var(--rule-2);border-radius:3px;overflow:hidden}
.vbar .t b{display:block;height:100%;border-radius:3px}
.vbar .val{font-family:var(--mono);font-size:.76rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.vch{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vch .kpi{padding:10px 12px}
.vch .kpi .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlead{font-size:.95rem;color:var(--ink-2);max-width:70rem;margin:0}
.vlead b{color:var(--ink)}
@media (max-width:560px){.vbar{grid-template-columns:minmax(0,1fr) auto}.vbar .t{grid-column:1/-1;grid-row:2}}
.vnav{position:sticky;top:0;z-index:30;display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;background:var(--paper);border-bottom:1px solid var(--rule)}
.vnav-b{font:500 .86rem var(--body);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.vnav-b:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.vnav-b:disabled{opacity:.45;cursor:not-allowed}
.rep-sec{scroll-margin-top:64px}
.vwrap .vbar{grid-template-columns:minmax(12rem,24rem) 1fr auto}
.vwrap .vbar>span:first-child{white-space:normal;line-height:1.3}
@media (max-width:560px){.vwrap .vbar{grid-template-columns:minmax(0,1fr) auto}}
#cliFrm .cli-bad{outline:2px solid var(--bad);outline-offset:1px}
.cliMsg[hidden]{display:none!important}

.cc-head,.cc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cc-head div{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding:4px 6px}
.cc-grid{border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cc-day{min-height:96px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cc-day.out{background:color-mix(in srgb,var(--ink) 4%,transparent);opacity:.65}.cc-day.today .cc-n{background:var(--ink);color:var(--bg,#fff);border-radius:10px;padding:0 6px}
.cc-n{font:600 .75rem var(--mono);align-self:flex-start}
.cc-ev{all:unset;cursor:pointer;display:block;font-size:.72rem;line-height:1.25;padding:3px 5px;border-radius:5px;border-left:3px solid var(--rule);background:color-mix(in srgb,var(--ink) 6%,transparent);overflow:hidden;overflow-wrap:anywhere}
.cc-ev span{display:block;color:var(--ink-2);font-size:.66rem}.cc-ev.ok{border-left-color:var(--ok)}.cc-ev.bad{border-left-color:var(--bad)}.cc-ev.warn{border-left-color:var(--warn)}
.cc-ev:hover,.cc-ev:focus-visible{outline:2px solid var(--ink-2)}
.cc-list{width:100%;border-collapse:collapse;margin-top:10px;font-size:.82rem}.cc-list th,.cc-list td{border-bottom:1px solid var(--rule-2,var(--rule));padding:5px 6px;text-align:left;vertical-align:top}
@media print{.cc-day{border-color:#999}.cc-grid{border-color:#999}.cc-ev{background:#f2f2f2;color:#111}.cc-list th,.cc-list td{border:1px solid #999}}
@media (max-width:700px){.cc-day{min-height:64px}.cc-ev b{display:none}}

.cr-tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:4px 0 12px}
.cr-tabs button{all:unset;cursor:pointer;padding:8px 14px;font:600 .9rem var(--body);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.cr-tabs button.on{color:var(--ink);border-bottom-color:var(--cyan)}.cr-tabs button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cr-sec{margin-top:14px}.cr-sec h3{margin:0 0 4px}.cr-mx td,.cr-mx th{white-space:nowrap}

.cc-ev.act{background:var(--cyan-soft);border-left-color:var(--cyan)}.cc-ev.act.ok{border-left-color:var(--ok)}.cc-ev.act.bad{border-left-color:var(--bad)}.cc-ev.cxl{text-decoration:line-through;opacity:.6}
@media print{.cc-ev.act{background:#e6f4f9}}

.cf-wrap{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.cf{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%}
.cf th,.cf td{padding:6px 8px;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-2);vertical-align:top;white-space:nowrap;text-align:left}
.cf thead th{position:sticky;top:0;z-index:2;background:var(--paper);font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.cf .cf-s0,.cf .cf-s1{position:sticky;background:var(--sheet);z-index:1}.cf .cf-s0{left:0;min-width:86px}.cf .cf-s1{left:86px;box-shadow:2px 0 0 var(--rule)}
.cf thead .cf-s0,.cf thead .cf-s1{z-index:3;background:var(--paper)}
.cf td.cf-w{white-space:normal;min-width:180px;max-width:280px}.cf td.cf-x{white-space:normal;min-width:240px;max-width:380px}.cf .num{text-align:right}
.cf-l div{padding:1px 0;border-bottom:1px dotted var(--rule-2)}.cf-l div:last-child{border:0}
.cf tbody tr:hover td{background:color-mix(in srgb,var(--cyan) 6%,var(--sheet))}

th.srt{cursor:pointer;user-select:none}th.srt:hover{color:var(--ink)}th.srt .srt-h{opacity:.35;font-size:.85em}
tr.cf-frow th{padding:4px 6px!important;background:var(--paper);text-transform:none;letter-spacing:0}
tr.cf-frow input{width:100%;min-width:70px;font:400 .78rem var(--body);padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.cf thead{position:sticky;top:0;z-index:3}.cf thead th{position:static}.cf thead .cf-s0,.cf thead .cf-s1{position:sticky}

.pj-bars{display:flex;flex-direction:column;gap:3px;font-size:.8rem}.pj-b{display:grid;grid-template-columns:minmax(120px,34%) 1fr 118px;gap:8px;align-items:center}
.pj-bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pj-bt{height:12px;background:var(--rule-2);border-radius:3px;overflow:hidden}.pj-bt i{display:block;height:100%;background:var(--cyan);border-radius:3px}
.pj-bv{font-family:var(--mono);font-size:.78rem;text-align:right;white-space:nowrap}.pj-bv em{font-style:normal;color:var(--ink-2);margin-left:6px}.pj-tot{border-top:1px solid var(--rule);padding-top:3px;font-weight:600}
@media print{.pj-bt{background:#e5e8ec}.pj-bt i{background:#0a8fb8}.pj-b{grid-template-columns:42% 1fr 90px}}

.ot-sec{border:1px solid var(--rule);border-radius:10px;margin:8px 0;background:var(--sheet)}.ot-sec>summary{cursor:pointer;padding:9px 12px;font:600 .82rem var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}.ot-sec[open]>summary{border-bottom:1px solid var(--rule-2)}
.ot-sec>.bd{padding:10px 12px!important}.ot-ck{display:flex!important;flex-direction:row!important;gap:6px;align-items:center;font-weight:400!important}

#cotHC input,#cotLin input,#cotFrm .ot-grid input{padding:3px 6px;min-height:0;height:28px;font-size:.8rem}#cotHC td,#cotHC th{padding:2px 6px}

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div style="display:flex;gap:14px;align-items:center;min-width:0">
        <div class="reg" aria-hidden="true"><i style="background:var(--cyan)"></i><i style="background:var(--magenta)"></i><i style="background:var(--yellow)"></i><i style="background:var(--key)"></i></div>
        <div style="min-width:0">
          <h1>Planes Gerenciales de la Editorial</h1>
          <div class="sub">Proyectos, iniciativas y mejoras consolidados por unidad: actividades, tareas, comisiones y metas, con personal y presupuesto</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="status" id="status"><span class="dot"></span><span id="statusTxt">Conectando…</span></div><button class="btn small" id="myPassBtn" hidden>Mi clave</button><button class="btn small" id="logoutBtn" hidden>Cerrar sesión</button></div>
    </div>
    <div id="myPassBox" hidden style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding-bottom:12px"><label class="note" for="myPass1" style="display:flex;flex-direction:column;gap:5px">Nueva clave<input id="myPass1" type="password" autocomplete="new-password"></label><label class="note" for="myPass2" style="display:flex;flex-direction:column;gap:5px">Repetir clave<input id="myPass2" type="password" autocomplete="new-password"></label><button class="btn primary small" id="myPassGo">Cambiar mi clave</button></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>

<dialog id="dlg"><form id="frm" method="dialog" novalidate>
  <div class="hd"><h2 id="dlgTitle">Registro</h2></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft"><div><button type="button" class="btn danger" id="dlgDel" hidden>Eliminar</button></div>
  <div style="display:flex;gap:10px"><button type="button" class="btn" id="dlgCancel">Cancelar</button><button type="submit" class="btn primary" id="dlgSave">Guardar</button></div></div>
</form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Estructura organizacional ===== */
const UNITS=[
 {id:'GG',ab:'GG',n:'Gerencia General',t:'Gerencia',p:null},
 {id:'GFC',ab:'GFC',n:'Gerencia Financiera Contable',t:'Gerencia',p:'GG'},
 {id:'CC',ab:'CC',n:'Coordinación Contable',t:'Coordinación',p:'GFC'},
 {id:'CAMP',ab:'CA',n:'Coordinación de Almacén de Materia Prima',t:'Coordinación',p:'GFC'},
 {id:'GV',ab:'GV',n:'Gerencia de Ventas',t:'Gerencia',p:'GG'},
 {id:'JV',ab:'JV',n:'Jefatura de Ventas',t:'Jefatura',p:'GV'},
 {id:'VDEN',ab:'CVD',n:'Coordinación de Ventas Denominacionales',t:'Coordinación',p:'GV'},
 {id:'VEDU',ab:'CVE',n:'Coordinación de Ventas Educación',t:'Coordinación',p:'GV'},
 {id:'JD',ab:'JD',n:'Jefatura de Diseño',t:'Jefatura',p:'GV'},
 {id:'JAPT',ab:'JA',n:'Jefatura de Almacén de Productos Terminados',t:'Jefatura',p:'GV'},
 {id:'CPA',ab:'CP',n:'Coordinación de Pañolenci',t:'Coordinación',p:'GV'},
 {id:'GP',ab:'GP',n:'Gerencia de Producción',t:'Gerencia',p:'GG'},
 {id:'CPP',ab:'CPP',n:'Coordinación de Preprensa',t:'Coordinación',p:'GP'},
 {id:'JPR',ab:'JPR',n:'Jefatura de Prensa',t:'Jefatura',p:'GP'},
 {id:'JPP',ab:'JPP',n:'Jefatura de Posprensa',t:'Jefatura',p:'GP'},
 {id:'CMT',ab:'CM',n:'Coordinación de Mantenimiento',t:'Coordinación',p:'GP'},
 {id:'CSO',ab:'CS',n:'Coordinación de SOMA',t:'Coordinación',p:'GG'},
 {id:'CCOM',ab:'CC',n:'Coordinación de Comunicaciones',t:'Coordinación',p:'GG'},
 {id:'CAP',ab:'CA',n:'Capellanía',t:'Capellanía',p:'GG'}
];
const U=Object.fromEntries(UNITS.map(u=>[u.id,u]));
/* Código correlativo de proyecto: siglas de la gerencia + siglas de la unidad + número */
function parentGer(id){let u=U[U[id]?.p];while(u&&u.t!=='Gerencia')u=U[u.p];return u}
function unitPrefix(id){const u=U[id];if(!u)return 'PR';return u.t==='Gerencia'?u.ab:(parentGer(id)?.ab||'')+u.ab}
function nextCode(unit,exceptId){const pre=unitPrefix(unit);const re=new RegExp('^'+pre+'-(\\d+)$');let max=0;RAW.proyectos.forEach(p=>{if(p.id===exceptId)return;const m=String(p.codigo||'').match(re);if(m)max=Math.max(max,+m[1])});return pre+'-'+String(max+1).padStart(3,'0')}
const kids=id=>UNITS.filter(u=>u.p===id);
function desc(id){const out=[id];kids(id).forEach(k=>out.push(...desc(k.id)));return out}
function depth(id){let d=0,u=U[id];while(u&&u.p){d++;u=U[u.p]}return d}
function gerenciaOf(id){let u=U[id];if(!u)return null;if(u.id==='GG')return 'GG';while(u.p&&u.p!=='GG')u=U[u.p];return u.id}
const unitOpts=UNITS.map(u=>[u.id,' '.repeat(depth(u.id))+u.n]);

/* ===== Esquemas de registro ===== */
const EST_PROY=['Por iniciar','En curso','En riesgo','Detenido','Cerrado'];
const EST_ACT=['Pendiente','En curso','Atrasada','Completada'];
const EST_TAR=['Pendiente','En proceso','Bloqueada','Hecha'];
const PRIO=['Alta','Media','Baja'];
const NIV=['Baja','Media','Alta'];
const EST_COM=['Asignada','En proceso','Cumplida','No cumplida'];
const SCH={
 personal:{t:'Personal',one:'colaborador',fields:[
  ['nombre','Nombre completo','text',1],['cargo','Cargo / puesto','text',1],['unidad','Unidad','unit',1],
  ['estado','Situación','sel',1,['Activo','Vacante','Proyectado','Cesado']],
  ['tipo','Modalidad','sel',0,['Planilla','Locación de servicios','Practicante','Temporal']],
  ['condicion','Condición laboral','sel',0,['Empleado','Contratado']],
  ['fechaIngreso','Fecha de ingreso (real o proyectada)','date'],['remuneracion','Remuneración mensual (S/)','num'],
  ['dni','Documento / código interno','text'],['contacto','Teléfono o correo','text'],['obs','Observaciones (perfil requerido, motivo de la plaza)','area']]},
 proyectos:{t:'Proyectos/Iniciativas/Mejoras',one:'proyecto, iniciativa o mejora',fields:[
  ['codigo','Código (automático)','code'],['nombre','Nombre del proyecto','text',1],['unidad','Unidad responsable','unit',1],['catalogo','Actividad de gerencia vinculada (catálogo)','catalog'],
  ['responsable','Responsable (gerente, jefe o coordinador)','lider'],['objetivo','Objetivo estratégico','area'],
  ['periodos','Periodos de ejecución','periods'],['prioridad','Prioridad','sel',0,PRIO],['estado','Estado','sel',1,EST_PROY],
  ['presupuesto','Techo presupuestal aprobado (S/)','num'],['fuente','Fuente / partida presupuestal','text']]},
 actividades:{t:'Actividades',one:'actividad',fields:[
  ['proyecto','Proyecto','ref:proyectos',1],['catalogo','Actividad principal del catálogo','catalog'],['nombre','Actividad','text',1],['responsable','Responsable','person'],
  ['periodos','Periodos de ejecución','periods'],['estado','Estado','sel',1,EST_ACT],['avance','Avance manual (%) — solo si no tiene tareas','num'],
  ['presupuesto','Presupuesto (S/)','num'],['ejecutado','Ejecutado (S/)','num'],['entregable','Entregable / evidencia de cumplimiento','text']]},
 tareas:{t:'Tareas',one:'tarea',fields:[
  ['actividad','Actividad','ref:actividades',1],['nombre','Tarea','text',1],['responsable','Responsable','person'],
  ['periodos','Periodos de ejecución','periods'],['prioridad','Prioridad','sel',0,PRIO],['estado','Estado','sel',1,EST_TAR],['obs','Notas','area']]},
 comisiones:{t:'Comisiones',one:'comisión',fields:[
  ['tarea','Tarea','ref:tareas',1],['persona','Persona comisionada','person',1],['encargo','Encargo / compromiso personal','area',1],
  ['periodos','Periodos de ejecución','periods'],['estado','Estado','sel',1,EST_COM],['cumplimiento','Cumplimiento (%)','num'],['evidencia','Evidencia / entregable','text']]},
 metas:{t:'Metas',one:'meta',fields:[
  ['proyecto','Proyecto','ref:proyectos',1],['gerente','Gerente que registra la meta','gerente',1],
  ['indicador','Indicador','text',1],['tipo','Tipo de indicador','sel',1,['Numérico','Porcentual']],['medida','Unidad de medida (ej. ejemplares, librerías, %)','text'],
  ['base','Línea base','num'],['meta','Meta','num',1],['logrado','Logrado a la fecha','num'],['fecha','Fecha meta','date'],
  ['frecuencia','Frecuencia de medición','sel',0,['Mensual','Trimestral','Semestral','Anual']],['actividad','Actividad vinculada (opcional)','ref:actividades']]},
 riesgos:{t:'Riesgos',one:'riesgo',fields:[
  ['proyecto','Proyecto','ref:proyectos',1],['descripcion','Riesgo','area',1],
  ['probabilidad','Probabilidad','sel',1,NIV],['impacto','Impacto','sel',1,NIV],
  ['mitigacion','Acción de mitigación','area'],['responsable','Responsable','person'],
  ['estado','Estado','sel',0,['Abierto','Mitigado','Cerrado']]]}
};
const COLS=Object.keys(SCH);

/* ===== Estado y almacenamiento ===== */
const S={},RAW={};COLS.forEach(c=>{S[c]=[];RAW[c]=[]});
let db=null,downloads=null,assets=null,mode='init',readOnly=false;
const LKEY='plan-gerencial-local-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||'{}');COLS.forEach(c=>RAW[c]=j[c]||[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(RAW))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const SENS=['remuneracion','dni','contacto'];
const isAdm=()=>typeof canManage==='function'&&canManage();
async function put(col,obj){
  if(col==='personal'&&!isAdm())throw {code:'invalid_argument',message:'Solo el administrador registra personal.'};
  if(mode==='db'&&col==='personal'){const pub={...obj},priv={id:obj.id};SENS.forEach(k=>{if(k in pub){priv[k]=pub[k];delete pub[k]}});
    await db.collection('personal').doc(obj.id).set(pub);await db.collection('personal_priv').doc(obj.id).set(priv);return}
  if(mode==='db'){await db.collection(col).doc(obj.id).set(obj)}
  else{const i=RAW[col].findIndex(x=>x.id===obj.id);if(i>=0)RAW[col][i]=obj;else RAW[col].push(obj);saveLocal();render()}
}
async function del(col,id){
  if(col==='personal'&&!isAdm())throw {code:'invalid_argument',message:'Solo el administrador elimina personal.'};
  if(mode==='db'&&col==='personal'){await db.collection('personal').doc(id).delete();await db.collection('personal_priv').doc(id).delete().catch(()=>{});return}
  if(mode==='db'){await db.collection(col).doc(id).delete()}
  else{RAW[col]=RAW[col].filter(x=>x.id!==id);saveLocal();render()}
}
function dbErr(e){
  if(e&&e.code==='invalid_argument'){readOnly=true;toast('No tienes permiso para guardar. Verifica que tu usuario esté activo o vuelve a ingresar.');render()}
  else if(e&&e.code==='quota_exceeded')toast('Se alcanzó el límite de registros. Elimina registros antiguos para continuar.');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>+v||0;
const money=v=>'S/ '+n(v).toLocaleString('es-PE',{maximumFractionDigits:0});
const kmoney=v=>{v=n(v);return v>=1e6?'S/ '+(v/1e6).toFixed(2)+' M':v>=1e3?'S/ '+(v/1e3).toFixed(1)+' k':'S/ '+v.toFixed(0)};
const pct=v=>Math.round(v)+'%';
const fdate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}):'—';
const today=()=>new Date().toISOString().slice(0,10);
const byId=(col,id)=>RAW[col].find(x=>x.id===id);
const pname=id=>byId('personal',id)?.nombre||'—';
const exTag=r=>r.ejemplo?'<span class="ex" title="Registro de ejemplo">EJEMPLO</span>':'';
function unitOfAct(a){return byId('proyectos',a?.proyecto)?.unidad}
function unitOf(col,r){
  if(col==='personal'||col==='proyectos'||col==='clientes')return r.unidad;
  if(col==='actividades')return unitOfAct(r);
  if(col==='tareas')return unitOfAct(byId('actividades',r.actividad));
  if(col==='comisiones')return unitOfAct(byId('actividades',byId('tareas',r.tarea)?.actividad));
  return byId('proyectos',r.proyecto)?.unidad;
}
function pillFor(v){
  const ok=['Entregado','Activo','Cerrado','Completada','Hecha','Mitigado','Baja','Cumplida'],warn=['En riesgo','Atrasada','Vacante','Media','Proyectado','Detenido','Abierto'],
        bad=['Bloqueada','Alta','No cumplida','Anulado'],info=['En curso','En proceso'];
  const c=ok.includes(v)?'ok':warn.includes(v)?'warn':bad.includes(v)?'bad':info.includes(v)?'info':'';
  return v?`<span class="pill ${c}">${esc(v)}</span>`:'—';
}
function meter(p){p=Math.max(0,p);return `<div class="meter ${p>100?'over':''}"><b style="width:${Math.min(100,p)}%"></b></div>`}
/* Consolidación: comisión → tarea → actividad → proyecto */
const comsOf=t=>S.comisiones.filter(c=>c.tarea===t.id);
const tarsOf=a=>S.tareas.filter(t=>t.actividad===a.id);
const actsOf=p=>S.actividades.filter(a=>a.proyecto===p.id);
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
function comAv(c){if(c.cumplimiento!==undefined&&c.cumplimiento!=='')return Math.min(100,n(c.cumplimiento));return c.estado==='Cumplida'?100:0}
function tarAv(t){const cs=comsOf(t);if(cs.length)return avg(cs.map(comAv));return t.estado==='Hecha'?100:0}
function actAvance(a){
  const ts=tarsOf(a);
  if(ts.length)return avg(ts.map(tarAv));
  if(a.avance!==undefined&&a.avance!=='')return n(a.avance);
  return a.estado==='Completada'?100:0;
}
function consolidate(){S.proyectos.forEach(p=>{const as=actsOf(p);p._bud=as.length?as.reduce((s,a)=>s+n(a.presupuesto),0):n(p.presupuesto);p._ej=as.length?as.reduce((s,a)=>s+n(a.ejecutado),0):n(p.ejecutado)})}
function proyAvance(p){const as=S.actividades.filter(a=>a.proyecto===p.id);if(!as.length)return p.estado==='Cerrado'?100:0;return as.reduce((s,a)=>s+actAvance(a),0)/as.length}
function metaAvance(m){const den=n(m.meta)-n(m.base);if(!den)return 0;return (n(m.logrado)-n(m.base))/den*100}
function riesgoNivel(r){const v={Baja:1,Media:2,Alta:3};return v[r.probabilidad]*v[r.impacto]}
let toastT;function toast(m){const t=$('#toast');const d=[...document.querySelectorAll('dialog[open]')].pop();const host=d||document.body;if(t.parentNode!==host)host.appendChild(t);t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}

/* ===== Usuarios con clave (Supabase Auth), roles y alcance ===== */
const ROLES=['Administrador','Responsable de unidad','Usuario'];
const ROLE_HINT={'Administrador':'ve y registra todo, con el dashboard completo','Responsable de unidad':'ve y registra lo de su unidad y dependencias','Usuario':'ve y registra solo lo suyo y lo que tiene asignado'};
let USR=[],USR_READY=false,HAY_ADMIN=null,SESSION=null,newPassShown=null,authBusy=false;
const ME={ready:false,owner:false};
const CFG=window.PLAN_CONFIG||null;
const SB_URL=CFG?String(CFG.SUPABASE_URL||'').trim().replace(/\/(rest|auth)\/v1\/?.*$/,'').replace(/\/+$/,''):'';
const SB_KEY=CFG?String(CFG.SUPABASE_ANON_KEY||'').trim():'';
const CONFIG_ERR=!CFG?'No se encontró el archivo config.js junto a index.html. Súbelo a la misma carpeta del repositorio.'
  :!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SB_URL)?'En config.js, SUPABASE_URL debe ser la Project URL, por ejemplo https://abcdefghijkl.supabase.co (sin /rest/v1).'
  :!SB_KEY?'En config.js falta SUPABASE_ANON_KEY (la clave anon public de Supabase).'
  :!/^eyJ/.test(SB_KEY)?'La clave en config.js no parece la "anon public". Cópiala de Project Settings > API Keys > Legacy API Keys (empieza con eyJ).'
  :!window.supabase?'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet o desactiva el bloqueador de anuncios para esta página.':'';
const CONFIG_OK=!CONFIG_ERR;
const sb=CONFIG_OK?supabase.createClient(SB_URL,SB_KEY):null;
const EMAIL_DOM=(window.PLAN_CONFIG&&PLAN_CONFIG.DOMINIO_USUARIOS)||'plan-editorial.app';
const userKey=u=>norm(u).replace(/[^a-z0-9._-]/g,'');
const toEmail=u=>userKey(u)+'@'+EMAIL_DOM;
function genPass(){const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>a[b%a.length]).join('')}
function myAcc(){const id=SESSION?.user?.id;return id?USR.find(u=>u.id===id&&u.activo!==false)||null:null}
function actorId(){return myAcc()?.id||''}
const canManage=()=>myAcc()?.rol==='Administrador';
function access(){
  if(!CONFIG_OK)return 'none';
  if(!ME.ready||(SESSION&&!USR_READY))return 'pending';
  const a=myAcc();if(!a)return 'none';
  return a.rol==='Administrador'?'all':a.rol==='Responsable de unidad'?'unidad':'usuario';
}
function applyScope(ac){
  if(ac==='all'){COLS.forEach(c=>S[c]=RAW[c]);return}
  const a=myAcc()||{};const per=a.persona||'';const me=a.id;
  const mine=r=>(me&&r.creadoPor===me)||(per&&(r.responsable===per||r.persona===per||r.gerente===per));
  const units=ac==='unidad'&&a.unidad?desc(a.unidad):[];
  const P=new Set(RAW.proyectos.filter(p=>units.includes(p.unidad)||mine(p)).map(p=>p.id));
  const A=new Set(RAW.actividades.filter(x=>P.has(x.proyecto)||mine(x)).map(x=>x.id));
  const T=new Set(RAW.tareas.filter(x=>A.has(x.actividad)||mine(x)).map(x=>x.id));
  const C=new Set(RAW.comisiones.filter(x=>T.has(x.tarea)||mine(x)).map(x=>x.id));
  RAW.comisiones.forEach(x=>{if(C.has(x.id))T.add(x.tarea)});
  RAW.tareas.forEach(x=>{if(T.has(x.id))A.add(x.actividad)});
  const Pall=new Set(P);RAW.actividades.forEach(x=>{if(A.has(x.id))Pall.add(x.proyecto)});
  S.proyectos=RAW.proyectos.filter(x=>Pall.has(x.id));
  S.actividades=RAW.actividades.filter(x=>A.has(x.id));
  S.tareas=RAW.tareas.filter(x=>T.has(x.id));
  S.comisiones=RAW.comisiones.filter(x=>C.has(x.id));
  S.metas=RAW.metas.filter(x=>P.has(x.proyecto)||mine(x));
  S.riesgos=RAW.riesgos.filter(x=>P.has(x.proyecto)||mine(x));
  const pu=ac==='unidad'&&a.unidad?desc(a.unidad):[];
  S.personal=RAW.personal.filter(x=>pu.includes(x.unidad)||(per&&x.id===per)).map(x=>{const o={...x};SENS.forEach(k=>delete o[k]);return o});
}
/* Unidades que el usuario puede ver y en las que puede registrar (null = todas, solo administrador) */
function myScopeUnits(){if(canManage())return null;const a=myAcc()||{};if(!a.unidad||!U[a.unidad])return [];return a.rol==='Responsable de unidad'?desc(a.unidad):[a.unidad]}
function myUnitOpts(){const s=myScopeUnits();return s?unitOpts.filter(([v])=>s.includes(v)):unitOpts}
function scopeLabel(){const a=myAcc();if(!a)return '';return a.nombre+' · '+a.rol+(a.rol==='Responsable de unidad'&&U[a.unidad]?' ('+U[a.unidad].n+')':'')}

/* Pantallas sin sesión */
const fld=(id,label,type='text',extra='')=>`<label class="note" for="${id}" style="display:flex;flex-direction:column;gap:5px">${label}<input id="${id}" type="${type}" ${extra}></label>`;
function viewLogin(){

   <form id="loginF" style="display:flex;flex-direction:column;gap:12px" novalidate>
    ${first?fld('lgNom','Nombre completo'):''}
    ${fld('lgUser','Usuario','text','autocomplete="username" autocapitalize="none" spellcheck="false"')}
    ${fld('lgPass','Clave'+(first?' (mínimo 6 caracteres)':''),'password',first?'autocomplete="new-password"':'autocomplete="current-password"')}
    <div id="lgMsg" class="note" style="color:var(--bad);min-height:1.2em"></div>
    <button class="btn primary" type="submit" ${authBusy?'disabled':''}>${first?'Crear administrador':'Ingresar'}</button>
   </form>
   ${first?'':'<span class="note">¿Olvidaste tu clave? Pide al administrador que te asigne una nueva.</span>'}
  </div>`;
}
async function doLogin(e){
  e.preventDefault();const msg=$('#lgMsg');const first=HAY_ADMIN===false;
  const usuario=userKey($('#lgUser').value),pw=$('#lgPass').value;
  if(!usuario||!pw){msg.textContent='Escribe tu usuario y tu clave.';return}
  authBusy=true;msg.textContent='';
  try{
    if(first){
      const nombre=($('#lgNom')?.value||'').trim();
      if(!nombre){msg.textContent='Escribe tu nombre.';return}
      if(pw.length<6){msg.textContent='La clave debe tener al menos 6 caracteres.';return}
      const {data,error}=await sb.auth.signUp({email:toEmail(usuario),password:pw});
      if(error)throw error;
      if(!data.session){msg.textContent='En Supabase, desactiva "Confirm email" (Authentication > Sign In / Providers > Email) y vuelve a intentarlo.';return}
      const r=await sb.rpc('crear_primer_admin',{p_nombre:nombre,p_usuario:usuario});if(r.error)throw r.error;
      await loadUsers();toast('Administrador creado. Bienvenido, '+nombre+'.');
    }else{
      const {error}=await sb.auth.signInWithPassword({email:toEmail(usuario),password:pw});
      if(error){msg.textContent=/invalid/i.test(error.message)?'Usuario o clave incorrectos.':/many|rate/i.test(error.message)?'Demasiados intentos. Espera un momento.':'No se pudo ingresar: '+error.message;return}
      tab='dash';
    }
  }catch(err){msg.textContent='No se pudo completar: '+(err.message||err)}
  finally{authBusy=false}
}
async function becomeAdmin(){const nombre=$('#baNom').value.trim();if(!nombre){toast('Escribe tu nombre.');return}
  const usuario=(SESSION.user.email||'').split('@')[0];const r=await sb.rpc('crear_primer_admin',{p_nombre:nombre,p_usuario:usuario});
  if(r.error){toast('No se pudo: '+r.error.message);return}await loadUsers();render()}

async function changeMyPass(){
  const v=$('#myPass1').value,v2=$('#myPass2').value;

function bindUsers(){
  const go=$('#nuGo');if(go)go.onclick=async()=>{
    const nombre=$('#nuNom').value.trim(),usuario=userKey($('#nuUsr').value),clave=$('#nuPas').value,rol=$('#nuRol').value,unidad=$('#nuUni').value,persona=$('#nuPer').value;
    if(!nombre||!usuario){toast('Escribe el nombre y el usuario.');return}
    if(usuario.length<3){toast('El usuario debe tener al menos 3 caracteres (letras, números, punto o guion).');return}
    if(clave.length<6){toast('La clave debe tener al menos 6 caracteres.');return}
    if(USR.some(u=>u.usuario===usuario)){toast('Ese usuario ya existe. Elige otro.');return}
    if(rol==='Responsable de unidad'&&!unidad){toast('Elige la unidad del responsable.');return}
    go.disabled=true;
    try{
      const tmp=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'plan-tmp-'+Date.now()}});
      const {data,error}=await tmp.auth.signUp({email:toEmail(usuario),password:clave});
      if(error)throw error;if(!data.user)throw new Error('Supabase no devolvió el usuario');
      const r=await sb.from('perfiles').insert({id:data.user.id,usuario,nombre,rol,unidad,persona,activo:true});if(r.error)throw r.error;
      newPassShown={nombre,usuario,clave};await loadUsers();toast('Usuario creado.');render();
    }catch(e){go.disabled=false;toast(/registered|exists/i.test(e.message||'')?'Ese usuario ya existe en Supabase.':'No se pudo crear el usuario: '+(e.message||e))}
  };
  const cp=$('#cpCred');if(cp)cp.onclick=()=>{const t=`Planes Gerenciales de la Editorial\n${location.href.split('#')[0]}\nUsuario: ${newPassShown.usuario}\nClave: ${newPassShown.clave}`;navigator.clipboard?.writeText(t).then(()=>toast('Datos copiados.')).catch(()=>toast('No se pudo copiar; anótalos a mano.'))};
  const upd=async(id,patch,okMsg)=>{const r=await sb.from('perfiles').update(patch).eq('id',id);if(r.error)toast('No se pudo guardar: '+r.error.message);else{toast(okMsg||'Cambios guardados.');loadUsers()}};
  document.querySelectorAll('[data-urol]').forEach(s=>s.onchange=()=>{const u=USR.find(x=>x.id===s.dataset.urol);if(s.value==='Responsable de unidad'&&!u.unidad)toast('Asigna también la unidad del responsable.');upd(u.id,{rol:s.value})});
  document.querySelectorAll('[data-uunit]').forEach(s=>s.onchange=()=>upd(s.dataset.uunit,{unidad:s.value}));
  document.querySelectorAll('[data-uper]').forEach(s=>s.onchange=()=>upd(s.dataset.uper,{persona:s.value}));
  document.querySelectorAll('[data-utog]').forEach(b=>b.onclick=()=>{const u=USR.find(x=>x.id===b.dataset.utog);upd(u.id,{activo:u.activo===false},u.activo===false?'Usuario activado.':'Usuario desactivado.')});
  document.querySelectorAll('[data-ureset]').forEach(b=>b.onclick=async()=>{const u=USR.find(x=>x.id===b.dataset.ureset);const clave=genPass();const r=await sb.rpc('admin_cambiar_clave',{p_id:u.id,p_clave:clave});if(r.error){toast('No se pudo cambiar la clave: '+r.error.message);return}newPassShown={nombre:u.nombre,usuario:u.usuario,clave};render();toast('Clave restablecida.')});
  document.querySelectorAll('[data-urm]').forEach(b=>b.onclick=async()=>{if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Confirmar';return}const r=await sb.rpc('admin_eliminar_usuario',{p_id:b.dataset.urm});if(r.error)toast('No se pudo eliminar: '+r.error.message);else{toast('Usuario eliminado.');loadUsers()}});
}

/* 'GG!' = solo lo registrado por la Gerencia General (sin sus unidades dependientes) */
const fUnit=()=>filterUnit==='GG!'?'GG':filterUnit;
function inFilter(col,r){if(filterUnit==='ALL')return true;const u=unitOf(col,r);if(filterUnit==='GG!')return u==='GG';return u&&desc(filterUnit).includes(u)}
function unitFilterSel(id='fu'){return `<select id="${id}" aria-label="Filtrar por unidad"><option value="ALL">${canManage()?'Toda la organización':'Toda mi información'}</option>${myUnitOpts().map(([v,l])=>v==='GG'?`<option value="GG" ${filterUnit==='GG'?'selected':''}>Gerencia General — ALL (todas las unidades)</option><option value="GG!" ${filterUnit==='GG!'?'selected':''}>Gerencia General — solo lo registrado por GG</option>`:`<option value="${v}" ${v===filterUnit?'selected':''}>${esc(l)}</option>`).join('')}</select>`}

function render(){
  const ac=access();
  const st=$('#status');st.classList.toggle('on',mode==='db');
  $('#statusTxt').textContent=(mode==='db'?(readOnly?'Datos compartidos · solo lectura':'Datos en la nube'):mode==='local'?'Guardado solo en este navegador':'Conectando…')+(mode==='db'&&ME.ready&&scopeLabel()?' · '+scopeLabel():'');
  const lo=$('#logoutBtn');if(lo)lo.hidden=!(mode==='db'&&myAcc());const mp=$('#myPassBtn');if(mp)mp.hidden=!(mode==='db'&&myAcc());
  const v=$('#view');
  if(ac==='pending'){$('#tabs').innerHTML='';v.innerHTML='<div class="panel empty"><strong>Verificando acceso…</strong>Un momento, por favor.</div>';return}
  if(ac==='none'){$('#tabs').innerHTML='';v.innerHTML=viewLogin();bindView();return}
  applyScope(ac);scopeClientes(ac);scopeProd(ac);scopeHrs(ac);scopeCot(ac);consolidate();
  if(tab==='users'&&!canManage())tab='dash';
  renderTabs();
  if(tab==='dash')v.innerHTML=viewDash();
  else if(tab==='org')v.innerHTML=viewUnits();
  else if(tab==='cal')v.innerHTML=viewCal();
  else if(tab==='ventas')v.innerHTML=viewVentas();
  else if(tab==='req')v.innerHTML=viewReqs();
  else if(tab==='clientes')v.innerHTML=viewClientes();
  else if(tab==='prod')v.innerHTML=viewProdMod();
  else if(tab==='cot')v.innerHTML=viewCot();
  else if(tab==='users')v.innerHTML=viewUsers();
  else v.innerHTML=viewList(tab);
  bindView();
}

function viewList(col){
  const sc=SCH[col];
  let rows=S[col].filter(r=>inFilter(col,r));
  if(q){const ql=q.toLowerCase();rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(ql))}
  rows.sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));
  const needs={actividades:'proyectos',tareas:'actividades',comisiones:'tareas',metas:'proyectos',riesgos:'proyectos'}[col];
  const blocked=needs&&!S[needs].length;
  let html=`<div class="bar"><div class="left"><h2>${sc.t}</h2><span class="note">${rows.length} de ${S[col].length} registros</span></div>
  <div class="right"><input class="search" id="q" type="search" placeholder="Buscar…" value="${esc(q)}" aria-label="Buscar">${unitFilterSel()}
  <button class="btn" data-export="${col}">Exportar CSV</button>${col==='personal'&&!readOnly&&isAdm()?`<button class="btn" data-import aria-pressed="${imp.open}">Importar lista</button>`:''}
  ${col==='personal'&&!isAdm()?'<span class="note">Solo el administrador registra personal</span>':`<button class="btn primary" data-new="${col}" ${readOnly||blocked?'disabled':''}>+ Nuevo ${sc.one}</button>`}</div></div>`;
  if(col==='personal'&&imp.open)html+=viewImport();
  if(blocked)html+=`<div class="note">Primero registra al menos un ${SCH[needs].one} para poder crear ${sc.t.toLowerCase()}.</div>`;
  if(!rows.length){html+=`<div class="panel empty"><strong>Aún no hay ${sc.t.toLowerCase()} ${filterUnit!=='ALL'?'en esta unidad':''}</strong>Usa “+ Nuevo ${sc.one}” para registrar el primero.</div>`;return html}
  const heads=LISTCOLS[col](rows[0]);
  html+=`<div class="tbl"><table><thead><tr>${heads.map(h=>`<th class="${h[2]||''}">${h[0]}</th>`).join('')}<th></th></tr></thead><tbody>`;

  const prev=(RAW.prodJobs||[]).filter(x=>x.id!==(pjEd&&pjEd.id)&&(x.razonSocial||x.dirFiscal)&&((nr&&String(x.ruc||'').replace(/\s/g,'')===nr)||(!nr&&nc&&norm(x.cliente)===nc))).sort((a,b)=>String(b.actualizado||'').localeCompare(String(a.actualizado||'')))[0];
  let src=prev;if(!src&&typeof cotClientes==='function'){const L=cotClientes();src=L.find(c=>nr&&String(c.ruc||'').replace(/\s/g,'')===nr)||L.find(c=>nc&&norm(c.cliente)===nc);if(src)src={razonSocial:src.cliente,ruc:src.ruc,dirFiscal:src.direccion,correoFact:src.correo}}
  if(!src)return;let k=0;const set=(f,v)=>{const el=q(f);if(el&&!el.value&&v!=null&&v!==''){el.value=v;k++}};
  ['razonSocial','ruc','dirFiscal','fDistrito','fProvincia','fDepto','fUbigeo','correoFact'].forEach(f=>set(f,src[f]));
  if(src.tipoDocId&&k)q('tipoDocId').value=src.tipoDocId;else if(q('ruc').value)q('tipoDocId').value=pjTDocAuto(q('ruc').value);
  if(k)toast('Datos SUNAT completados con el último registro de este cliente.')}

function pjParseInforme(wb,X){const G=n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  const find=(g,re)=>{for(let r=0;r<g.length;r++)for(let c=0;c<(g[r]||[]).length;c++){const v=g[r][c];if(typeof v==='string'&&re.test(norm(v)))return [r,c]}return null};
  const num=v=>typeof v==='number'?v:null;
  const list=(g,re,skipHdr)=>{const p=find(g,re);if(!p)return [];let [r,c]=p;r++;if(skipHdr)r++;const out=[];let blank=0;for(;r<g.length&&blank<4;r++){const k=(g[r]||[])[c];if(k==null||k===''){blank++;continue}blank=0;if(/^total/i.test(norm(k)))break;out.push([String(k).trim(),num(g[r][c+1])||0])}return out};
  const names=wb.SheetNames;const gSh=names.find(s=>/grafic/i.test(norm(s)))||names[0],cSh=names.find(s=>/compar/i.test(norm(s)));const g=G(gSh);
  const t=find(g,/trabajos entregados/);const anio=t?((String(g[t[0]][t[1]]).match(/20\d\d/)||[])[0]):((gSh.match(/20\d\d/)||[])[0]);
  const H={anio:anio||String(new Date().getFullYear()),porCliente:list(g,/^trabajos por cliente/),porCampo:list(g,/trabajos por campo/),porDepto:list(g,/trabajos por departamento/),porEvento:list(g,/trabajos por evento/),porClasif:list(g,/trabajos por clasificaci/),participacion:list(g,/participacion por cliente/,true),mensual:{},factMes:[],factCampo:{cols:[],rows:[]},rrpp:[]};
  const st=k=>{const p=find(g,k);return p?num(g[p[0]][p[1]+1]):null};H.stats={min:st(/minima de trabajos/),max:st(/maxima de trabajos/),prom:st(/promedio de trabajos/)};
  let p=find(g,/facturar segun produccion/);if(p){for(let r=p[0]+2,i=0;i<12&&r<g.length;r++,i++){const row=g[r]||[];H.factMes.push([PJ_MES[i],num(row[p[1]+1]),num(row[p[1]+2]),num(row[p[1]+3])])}}
  p=find(g,/facturar por campo/);if(p){const hr=g[p[0]+1]||[];const cols=[];for(let c=p[1]+1;c<hr.length&&hr[c];c++)cols.push(String(hr[c]).trim());H.factCampo.cols=cols.map(c=>{const t=c.charAt(0)+c.slice(1).toLowerCase();return ({Upeu:'UPeU',Aces:'ACES',Eiu:'EIU'})[t]||t});
    for(let r=p[0]+2,i=0;i<12&&r<g.length;r++,i++){const row=g[r]||[];H.factCampo.rows.push([PJ_MES[i],...cols.map((_,k)=>num(row[p[1]+1+k]))])}}
  p=find(g,/descripcion - rrpp/);if(p){let mes='';const c=p[1];for(let r=p[0]+1;r<g.length;r++){const row=g[r]||[];const m=row[c-3];if(m)mes=String(m).trim().toUpperCase().replace('SEP','SET').slice(0,3);const job=row[c-1];if(!job){if(row.some(v=>typeof v==='string'&&/total/i.test(v)))break;continue}
    const cl=row[c+1];H.rrpp.push({mes,job:String(job),desc:String(row[c]||'').trim(),cliente:typeof cl==='string'?cl.trim():'—',cant:num(row[c+2]),pv:num(row[c+3]),total:Math.round((num(row[c+4])||0)*100)/100})}}
  if(cSh){const cg=G(cSh);let q=find(cg,/2023 - 20|\d{4} - \d{4}/);let hr=null;if(q){for(let r=q[0];r<q[0]+4&&r<cg.length;r++)if(norm((cg[r]||[])[q[1]])==='mes'){hr=r;break}}
    if(hr==null){const m=find(cg,/^mes$/);hr=m?m[0]:null;q=m}
    if(hr!=null){const row=cg[hr],c0=q[1];for(let c=c0+1;c<row.length;c++){const y=row[c];if(!/^\d{4}$/.test(String(y)))continue;H.mensual[String(y)]=[];for(let i=0;i<12;i++)H.mensual[String(y)].push(num((cg[hr+1+i]||[])[c]))}}}

async function toggleReq(col,id,i,kind,on){
  const rec=byId(col,id);if(!rec||!rec.requerimientos||!rec.requerimientos[i])return;
  const o={...rec,requerimientos:rec.requerimientos.map(x=>({...x}))};delete o._bud;delete o._ej;
  const it=o.requerimientos[i];
  if(on)it[kind]={por:actorId(),nombre:actorName(),fecha:today()};else{delete it[kind];if(kind==='atGer')delete it.atFin}
  o.actualizado=new Date().toISOString();
  try{await put(col,o);toast(on?(kind==='atGer'?'Marcado como atendido por la gerencia del área.':'Atención confirmada por Gerencia Financiera.'):'Marca retirada.')}catch(e){dbErr(e);render()}
}

    ...rows.map(it=>[it.x.desc,it.x.tipo,it.x.cant,it.x.um,it.x.pu,it.total,RQ_LAB[it.col],it.origen,it.proj?.nombre,it.proj?.codigo,U[it.unit]?.n,it.x.atGer?.nombre||'',it.x.atGer?.fecha||'',it.x.atFin?.nombre||'',it.x.atFin?.fecha||''].map(q).join(';'))].join('\r\n');

function hbars(items,max){ // items: [{label,a,b}] a=asignado b=ejecutado
  const W=640,rowH=34,L=180,R=80,H=items.length*rowH+24;max=max||Math.max(1,...items.map(i=>Math.max(i.a,i.b)));
  const x=v=>L+(W-L-R)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Presupuesto por gerencia">`;
  [0,.25,.5,.75,1].forEach(f=>{const xx=x(max*f);s+=`<line x1="${xx}" x2="${xx}" y1="0" y2="${H-20}" stroke="var(--rule-2)"/><text x="${xx}" y="${H-6}" text-anchor="middle">${kmoney(max*f).replace('S/ ','')}</text>`});
  items.forEach((it,i)=>{const y=i*rowH+4;
    s+=`<text x="${L-10}" y="${y+16}" text-anchor="end" style="font-family:var(--body);font-size:12px;fill:var(--ink)">${esc(it.label)}</text>
    <rect x="${L}" y="${y+2}" width="${Math.max(0,x(it.a)-L)}" height="12" rx="2" fill="var(--cyan)" opacity=".35"/>
    <rect x="${L}" y="${y+16}" width="${Math.max(0,x(it.b)-L)}" height="8" rx="2" fill="${it.b>it.a?'var(--bad)':'var(--cyan)'}"/>
    <text x="${x(Math.max(it.a,it.b))+6}" y="${y+16}">${it.a?pct(it.b/it.a*100):'—'}</text>`});
  return s+'</svg>';
}
function projection(pers){
  const months=[];const d0=new Date();d0.setDate(1);
  for(let i=0;i<12;i++){const d=new Date(d0.getFullYear(),d0.getMonth()+i,1);months.push(d)}
  const end=d=>new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);
  const act=pers.filter(r=>r.estado==='Activo').length;
  const data=months.map(m=>{const e=end(m);const add=pers.filter(r=>(r.estado==='Proyectado'||r.estado==='Vacante')&&(r.fechaIngreso?r.fechaIngreso<=e:false)).length;return {m,v:act+add,c:pers.filter(r=>r.estado==='Activo'||((r.estado==='Proyectado'||r.estado==='Vacante')&&r.fechaIngreso&&r.fechaIngreso<=e)).reduce((s,r)=>s+n(r.remuneracion),0)}});
  const W=640,H=200,L=36,R=16,T=14,B=28,max=Math.max(4,...data.map(d=>d.v))*1.15,min=0;
  const x=i=>L+(W-L-R)*i/(data.length-1),y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Proyección de personal a 12 meses">`;
  const step=Math.max(1,Math.ceil(max/4));for(let v=0;v<=max;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule-2)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  const pts=data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ');
  s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(data.length-1)},${y(0)}" fill="var(--cyan)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${d.m.toLocaleDateString('es-PE',{month:'short'}).replace('.','')}</text>`;if(i===0||i===data.length-1)s+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" fill="var(--cyan)"/><text x="${x(i)}" y="${y(d.v)-10}" text-anchor="middle" style="fill:var(--ink);font-weight:500">${d.v}</text>`});
  return {svg:s+'</svg>',last:data[data.length-1],first:data[0]};
}

/* ===== Periodos de ejecución del proyecto ===== */
function periodsOf(p){const ps=Array.isArray(p.periodos)&&p.periodos.length?p.periodos:(p.inicio||p.fin||p.vence?[{ini:p.inicio||p.vence||'',fin:p.fin||p.vence||''}]:[]);return ps.filter(x=>x.ini||x.fin).slice().sort((a,b)=>(a.ini||'').localeCompare(b.ini||''))}
const sdate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short'}).replace('.',''):'…';
function pshort(r){const ps=periodsOf(r);return ps.length?ps.map(x=>x.ini===x.fin?sdate(x.fin):`${sdate(x.ini)}–${sdate(x.fin)}`).join(' · '):'sin fechas'}
function periodState(p){const t=today(),ps=periodsOf(p);if(!ps.length)return null;
  const cur=ps.find(x=>(x.ini||'')<=t&&t<=(x.fin||'9999'));if(cur)return {c:'info',l:'En periodo activo'+(cur.desc?': '+cur.desc:'')};
  const nx=ps.find(x=>(x.ini||'')>t);if(nx)return {c:'',l:'Próximo periodo: '+fdate(nx.ini)};return {c:'ok',l:'Periodos concluidos'}}
function periodsHTML(p,short){const ps=periodsOf(p);if(!ps.length)return '—';
  const yr=d=>d?d.slice(0,4):'';
  return ps.map(x=>`<div style="white-space:nowrap">${sdate(x.ini)}${yr(x.ini)!==yr(x.fin)?' '+yr(x.ini):''} → ${sdate(x.fin)} ${yr(x.fin)}${!short&&x.desc?` <span class="note">${esc(x.desc)}</span>`:''}</div>`).join('')}
function periodStrip(p){
  const ps=periodsOf(p).filter(x=>x.ini&&x.fin);if(!ps.length)return '<span class="note">Sin periodos definidos</span>';
  const y0=+ps[0].ini.slice(0,4),y1=Math.max(...ps.map(x=>+x.fin.slice(0,4)));const a=Date.UTC(y0,0,1),b=Date.UTC(y1+1,0,1);
  const pos=d=>Math.max(0,Math.min(100,(Date.parse(d+'T00:00:00Z')-a)/(b-a)*100));
  const M='EFMAMJJASOND';let ticks='';
  for(let y=y0;y<=y1;y++)for(let m=0;m<12;m++){const x=(Date.UTC(y,m,1)-a)/(b-a)*100;const lab=m===0&&y1>y0?"'"+String(y).slice(2):M[m];ticks+=`<span style="position:absolute;left:${x}%;top:15px;font-family:var(--mono);font-size:9px;color:var(--ink-2)">${lab}</span><i style="position:absolute;left:${x}%;top:0;height:12px;border-left:1px solid var(--rule)"></i>`}
  const t=today(),tx=(t>=`${y0}-01-01`&&t<`${y1+1}-01-01`)?`<i title="Hoy" style="position:absolute;left:${pos(t)}%;top:-3px;height:18px;border-left:2px solid var(--magenta)"></i>`:'';
  const st=periodState(p);
  return `<div style="display:flex;flex-direction:column;gap:6px;max-width:560px"><div style="position:relative;height:28px"><div style="position:absolute;left:0;right:0;top:0;height:12px;background:var(--rule-2);border-radius:3px"></div>${ticks}${ps.map(x=>`<b title="${esc((x.desc?x.desc+': ':'')+fdate(x.ini)+' → '+fdate(x.fin))}" style="position:absolute;top:0;height:12px;left:${pos(x.ini)}%;width:${Math.max(.8,pos(x.fin)-pos(x.ini))}%;background:var(--cyan);border-radius:3px"></b>`).join('')}${tx}</div>
   <div class="note" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${st?`<span class="pill ${st.c}">${esc(st.l)}</span>`:''}${ps.length} ${ps.length===1?'periodo':'periodos'}: ${ps.map(x=>`${sdate(x.ini)}–${sdate(x.fin)}${x.desc?' ('+esc(x.desc)+')':''}`).join(' · ')}</div></div>`;
}
function renderPeriods(){
  const box=$('#periodsBox');if(!box)return;const ps=editing.r.periodos;
  box.innerHTML=ps.map((x,i)=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;padding:8px;border:1px solid var(--rule-2);border-radius:6px">
    <label for="pi_${i}" style="font-weight:400">Inicio ${i+1}<input type="date" id="pi_${i}" data-pi="${i}" value="${esc(x.ini||'')}" ${readOnly?'disabled':''}></label>
    <label for="pf_${i}" style="font-weight:400">Fin ${i+1}<input type="date" id="pf_${i}" data-pf="${i}" value="${esc(x.fin||'')}" ${readOnly?'disabled':''}></label>
    <label for="pd_${i}" style="font-weight:400">Descripción (opcional)<input id="pd_${i}" data-pd="${i}" value="${esc(x.desc||'')}" placeholder="Ej. campaña escolar" ${readOnly?'disabled':''}></label>
    ${readOnly||ps.length<2?'':`<button type="button" class="link" data-pdel="${i}" style="color:var(--bad);justify-self:start;padding-bottom:10px">Quitar periodo</button>`}</div>`).join('')+(readOnly?'':'<div><button type="button" class="btn small" id="pAdd">+ Agregar periodo</button></div>');
  box.querySelectorAll('[data-pi]').forEach(e=>e.oninput=()=>ps[+e.dataset.pi].ini=e.value);

const REQ_COLS=['proyectos','actividades','tareas','comisiones'];
const REQ_TIPOS=['Bien / material','Servicio','Personal','Equipo','Viáticos','Otro'];
const reqItemTotal=x=>n(x.cant)*n(x.pu);
const reqTotal=r=>(r&&r.requerimientos||[]).reduce((s,x)=>s+reqItemTotal(x),0);
function reqConsol(col,r){
  let t=reqTotal(r);
  if(col==='proyectos')S.actividades.filter(a=>a.proyecto===r.id).forEach(a=>t+=reqConsol('actividades',a));
  else if(col==='actividades')S.tareas.filter(x=>x.actividad===r.id).forEach(x=>t+=reqConsol('tareas',x));
  else if(col==='tareas')S.comisiones.filter(x=>x.tarea===r.id).forEach(x=>t+=reqTotal(x));
  return t;
}
function reqCount(col,r){const own=(r.requerimientos||[]).length,tot=reqConsol(col,r);return tot||own?`<span class="mono" title="Requerimientos (incluye los niveles inferiores)">Req. ${money(tot)}</span>`:''}

}

const EV_COLS=['actividades','tareas','comisiones'];
const EXT_TYPE={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json',mp4:'video/mp4',webm:'video/webm'};
const fsize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function evCount(r){const n2=(r.evidencias||[]).length;return n2?`<span class="mono">${n2} ${n2===1?'evidencia':'evidencias'}</span>`:''}

   ${readOnly?'':assets?`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="btn small" for="evFile">Subir archivo…</label><input id="evFile" type="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.csv,.txt,.md,.json,.mp4,.webm"><span class="note" id="evMsg">PDF, imagen, CSV o TXT · máx. 20 MB. Word o Excel: guárdalos como PDF.</span></div>`:'<span class="note">Para subir archivos necesitas acceso de colaborador o editor en esta página.</span>'}
  </div>`;

function renderEv(){
  const l=$('#evList');if(!l)return;const ev=editing.r.evidencias||[];
  l.innerHTML=ev.length?ev.map((e,i)=>`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.85rem;padding:6px 10px;border:1px solid var(--rule-2);border-radius:6px"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nombre)} <span class="note">· ${fsize(e.tam||0)} · ${fdate(e.fecha)}</span></span><span style="display:flex;gap:10px;flex-shrink:0"><a class="link" href="#" data-evopen="${esc(e.id)}">Abrir</a>${readOnly?'':`<button type="button" class="link" data-evdel="${i}" style="color:var(--bad)">Quitar</button>`}</span></div>`).join(''):'<span class="note">Aún no hay archivos.</span>';
  l.querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{editing.r.evidencias=ev.filter((_,j)=>j!==+b.dataset.evdel);renderEv()});
}
async function uploadEv(files){
  const msg=$('#evMsg');const save=$('#dlgSave');save.disabled=true;
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toLowerCase();const type=EXT_TYPE[ext];
    if(!type){toast(`“${f.name}”: formato no admitido. Sube PDF, imagen, CSV o TXT (Word y Excel: guárdalos como PDF).`);continue}
    if(f.size>20*1048576){toast(`“${f.name}” pesa más de 20 MB. Comprímelo o divídelo.`);continue}
    if(msg)msg.textContent=`Subiendo ${f.name}…`;
    try{const r=await assets.upload(f,{type});editing.r.evidencias=[...(editing.r.evidencias||[]),{id:r.id,nombre:f.name,tipo:r.contentType,tam:r.sizeBytes,fecha:today()}];renderEv()}
    catch(e){toast(e?.code==='too_large'?`“${f.name}” es demasiado grande.`:e?.code==='quota_exceeded'?'Se llenó el espacio de archivos de esta página.':e?.code==='unsupported_type'?`“${f.name}”: formato no admitido.`:`No se pudo subir “${f.name}”. Inténtalo de nuevo.`)}
  }
  if(msg)msg.textContent='Archivos listos. Pulsa Guardar para registrarlos.';save.disabled=false;
}

function matchUnit(v){

  let u=UNITS.find(x=>norm(x.n)===t);if(u)return u.id;

function toDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}

  const idx={};IMP_COLS.forEach(([k,,al])=>{const i=head.findIndex(h=>al.map(norm).includes(h));if(i>=0)idx[k]=i});
  if(idx.nombre===undefined&&idx.cargo===undefined)return {err:'No se encontró la columna "Nombre completo" ni "Cargo". Revisa los encabezados o usa la plantilla.'};
  const existing=new Set(RAW.personal.map(p=>norm(p.nombre)+'|'+norm(p.cargo)));

      estado:matchOpt(g('estado'),['Activo','Vacante','Proyectado','Cesado'],'Activo'),
      tipo:matchOpt(g('tipo'),['Planilla','Locación de servicios','Practicante','Temporal'],''),
      condicion:matchOpt(g('condicion'),['Empleado','Contratado'],''),

/* Canal según código y nombre del reporte (corrige códigos repetidos o nombres que cambian) */
function vCanal(code,name){
  const s=norm(String(name||'').replace(/^\s*IU\s+/i,''));
  if(s.includes('suscrip'))return 'Suscripciones';
  if(s.includes('universidad'))return 'Universidades';
  if(/\bupn\b/.test(s))return 'Clientes UPN';
  if(/\bups\b/.test(s))return 'Clientes UPS';
  if(s.includes('upeu'))return 'Clientes UPeU';
  if(s.includes('institucion'))return 'Clientes Institucionales';
  if(s.includes('extranj'))return 'Clientes Extranjeros';
  if(s.includes('extern'))return 'Clientes Externos';
  if(s.includes('tienda')||s.includes('panolenci'))return 'Tienda Editorial';
  if(s.includes('misioner'))return 'Libro Misionero';
  if(s.includes('juliaca'))return 'Librería Juliaca';
  if(/\baces\b/.test(s))return 'Cliente ACES';
  if(s.includes('movil'))return 'Librería Móvil';
  const byCode=Object.entries(V_COD).find(([,c])=>c===String(code));
  return byCode?byCode[0]:String(name||code).trim();
}
function vNum(s){
  s=String(s??'').trim();if(!s)return null;if(/^-+$/.test(s))return 0;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  s=s.replace(/S\/\s*/i,'').replace(/\s/g,'').replace(/,/g,'');
  const v=Number(s);if(!isFinite(v))return null;return neg?-v:v;
}

/* Modelo de cálculo */
function vModel(src,rk){
  src=src||vSrc();rk=rk||vRank;
  const map=new Map(),maxMes={};
  src.forEach(r=>{const y=+r.anio;map.set(y+'|'+r.canal,r.meses||[]);const mm=(r.meses||[]).reduce((m,v,i)=>v!=null?i+1:m,0);maxMes[y]=Math.max(maxMes[y]||0,mm)});
  const years=[...new Set(src.map(r=>+r.anio))].filter(y=>maxMes[y]).sort((a,b)=>a-b);
  const canales=[...new Set(src.map(r=>r.canal))].sort((a,b)=>rk(a)-rk(b));
  const memo=new Map();
  const mens=(y,c)=>{const k=y+'|'+c;if(memo.has(k))return memo.get(k);let out=null;
    if(c==='Todos'||c==='Resto de canales'){
      const cs=canales.filter(x=>(c==='Todos'||(x!=='Suscripciones'&&x!=='Libro Misionero'))&&map.has(y+'|'+x));
      if(cs.length)out=V_MES.map((_,i)=>i<maxMes[y]?cs.reduce((s,x)=>s+(+map.get(y+'|'+x)[i]||0),0):null);
    }else if(map.has(k)){const m=map.get(k);out=V_MES.map((_,i)=>i<maxMes[y]?(+m[i]||0):null)}
    memo.set(k,out);return out};
  const acum=(y,c,corte)=>{if(!maxMes[y]||corte>maxMes[y])return null;const m=mens(y,c);if(!m)return null;let s=0;for(let i=0;i<corte;i++)s+=m[i]||0;return s};
  const anual=(y,c)=>acum(y,c,maxMes[y]);
  return {years,canales,maxMes,mens,acum,anual};
}
function vStats(M,y,corte,c){
  const m=M.mens(y,c);if(!m||corte>M.maxMes[y])return null;
  const vals=m.slice(0,corte).map(v=>v||0),n=vals.length,total=vals.reduce((a,b)=>a+b,0),prom=total/n;
  const s=[...vals].sort((a,b)=>a-b),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  const desv=n>1?Math.sqrt(vals.reduce((a,v)=>a+(v-prom)**2,0)/(n-1)):0;
  const iMax=vals.indexOf(Math.max(...vals)),iMin=vals.indexOf(Math.min(...vals));
  const tot=M.acum(y,'Todos',corte),prev=M.acum(y-1,c,corte);
  return {total,prom,med,desv,cv:prom?desv/Math.abs(prom):null,max:vals[iMax],mesMax:V_MES[iMax],min:vals[iMin],mesMin:V_MES[iMin],part:tot?total/tot:null,var:vVar(total,prev)};
}

  h+=`<h3 style="margin-top:6px">Comparativo anual</h3>

  const cSin=M.canales.filter(k=>k!=='Libro Misionero'),totSin=x=>{const v=cSin.map(k=>M.anual(x,k)).filter(a=>a!=null);return v.length?v.reduce((a,b)=>a+b,0):null};
  const valSin=(x,k)=>k==='__tot'?totSin(x):M.anual(x,k),yComp=M.years.filter((x,i)=>i>0&&M.maxMes[x]===12&&M.maxMes[M.years[i-1]]===12);
  h+=`<div class="panel"><h2 style="font-size:1.05rem">Cuadro anual por canal sin Libro Misionero</h2><div class="note">Soles. Libro Misionero vende por campañas y mueve mucho el total; sin él se ve mejor la tendencia del resto del negocio. Junto a cada año completo, su variación frente al año anterior.</div>
   <div class="tbl vt"><table><thead><tr><th>Canal</th>${M.years.map(x=>`<th class="num">${M.maxMes[x]<12?`${x} (a ${V_MES[M.maxMes[x]-1].toLowerCase()}.)`:x}</th>${yComp.includes(x)?`<th class="num">Var. ${String(x).slice(2)}/${String(x-1).slice(2)}</th>`:''}`).join('')}${cl?`<th class="num">Part. ${cl}</th>`:''}</tr></thead><tbody>${[...cSin,'__tot'].map(k=>
    `<tr class="${k==='__tot'?'vtot':''}"><td>${k==='__tot'?'Total sin Libro Misionero':esc(k)}</td>${M.years.map((x,i)=>{const a=valSin(x,k);let td=`<td class="num">${vN(a)}</td>`;if(yComp.includes(x)){const v=vVar(a,valSin(M.years[i-1],k));td+=`<td class="num ${vCls(v)}">${vP(v)}</td>`}return td}).join('')}${cl?`<td class="num">${vP1(valSin(cl,k)!=null&&totSin(cl)?valSin(cl,k)/totSin(cl):null)}</td>`:''}</tr>`).join('')}</tbody></table></div></div>`;

  {const cS=M.canales.filter(k=>k!=='Libro Misionero'),yS=M.years.filter(x=>M.acum(x,'Todos',c)!=null);
   const tS=x=>{const v=cS.map(k=>M.acum(x,k,c)).filter(a=>a!=null);return v.length?v.reduce((a,b)=>a+b,0):null};
   const vS2=(x,k)=>k==='__tot'?tS(x):M.acum(x,k,c),yL=yS[yS.length-1];

  const st=rowsAll.map(k=>({k,s:vStats(M,y,c,k)})).filter(o=>o.s);

  return h+repViews();
}

function vParse(text,anio,hasta){
  const warn=[];anio=+anio;
  if(!(anio>=2000&&anio<=2100))return {err:1,msg:'Escribe el año del cuadro.',warn,docs:[],years:[]};
  const lines=String(text||'').split(/\r?\n/).filter(l=>l.trim());
  const rows=[];let repTotal=null,noTabs=false;
  for(const line of lines){
    let cells=line.split('\t');
    if(cells.length<4){noTabs=true;const m=line.trim().match(/^(\d{6,10})\s+(.+?)\s+((?:-?[\d,.]+|-|\([\d,.]+\))(?:\s+(?:-?[\d,.]+|-|\([\d,.]+\)))*)\s*$/);
      if(m)cells=[m[1],m[2],...m[3].split(/\s+/)];else if(/total/i.test(line)){const nums=line.match(/-?[\d,]+\.\d{2}/g);if(nums)repTotal=vNum(nums[nums.length-1])}}
    const code=(cells[0]||'').trim();

    const name=(cells[1]||'').trim(),meses=[];for(let i=0;i<12;i++)meses.push(vNum(cells[2+i])??0);

  }
  if(!rows.length)return {err:1,msg:'No encontré filas de canales. Copia el cuadro desde AASINET (o Excel) incluyendo la columna del código de centro de costo.',warn,docs:[],years:[]};
  if(noTabs)warn.push('El texto pegado no trae separaciones de columna; si alguna fila tenía celdas vacías los meses pueden quedar corridos. Revisa la columna “Diferencia”.');
  let hm=+hasta||0;if(!hm)rows.forEach(r=>r.meses.forEach((v,i)=>{if(v)hm=Math.max(hm,i+1)}));hm=hm||12;
  const by=new Map();
  rows.forEach(r=>{const o=by.get(r.canal);if(o){warn.push(`“${r.name}” y otra fila se agruparon como ${r.canal}.`);o.meses=o.meses.map((v,i)=>v+r.meses[i]);o.total=(o.total||0)+(r.total||0);o.names.push(r.name)}else by.set(r.canal,{...r,names:[r.name]})});

    if(o.code!==V_COD[o.canal]&&V_COD[o.canal])warn.push(`${o.names.join(' / ')} venía con el código ${o.code}; se registra como ${o.canal} (${V_COD[o.canal]}).`);

  }

  const docs=[...by.values()].map(o=>({id:`${anio}-${vSlug(o.canal)}`,data:{anio,canal:o.canal,codigo:V_COD[o.canal]||o.code,meses:o.meses.map((v,i)=>i<hm?Math.round(v*100)/100:null),fuente:'AASINET',actualizado:today(),creadoPor:actorId()}}));

function vParseJson(obj){
  const warn=[];const arr=Array.isArray(obj)?obj:Array.isArray(obj?.rows)?obj.rows:Array.isArray(obj?.data)?obj.data:null;
  if(!arr||!arr.length)return {err:1,msg:'El archivo no tiene filas de ventas.',warn,docs:[],years:[]};
  const by=new Map();
  for(const r of arr){
    const anio=+r.anio;if(!(anio>=2000&&anio<=2100))continue;const canal=vCanal(r.codigo,r.canal);const k=anio+'|'+canal;
    const o=by.get(k)||{anio,canal,codigo:V_COD[canal]||String(r.codigo||''),meses:Array(12).fill(null)};
    if(Array.isArray(r.meses))r.meses.forEach((v,i)=>{if(i<12&&v!=null)o.meses[i]=(o.meses[i]||0)+(+v||0)});
    else if(+r.mes>=1&&+r.mes<=12)o.meses[+r.mes-1]=(o.meses[+r.mes-1]||0)+(+r.monto||0);
    by.set(k,o);
  }
  const vals=[...by.values()];if(!vals.length)return {err:1,msg:'No reconocí filas con año, canal y montos.',warn,docs:[],years:[]};
  const years=[...new Set(vals.map(o=>o.anio))].sort();
  const mmY={};vals.forEach(o=>o.meses.forEach((v,i)=>{if(v!=null)mmY[o.anio]=Math.max(mmY[o.anio]||0,i+1)}));
  const docs=vals.map(o=>({id:`${o.anio}-${vSlug(o.canal)}`,data:{anio:o.anio,canal:o.canal,codigo:o.codigo,meses:o.meses.map((v,i)=>i<mmY[o.anio]?Math.round((v||0)*100)/100:null),fuente:'AASINET',actualizado:today(),creadoPor:actorId()}}));
  const preview=years.map(y=>{const ds=vals.filter(o=>o.anio===y);return [String(y),`${ds.length} canales`,vN(ds.reduce((s,o)=>s+o.meses.reduce((a,b)=>a+(b||0),0),0)),`a ${V_MESL[mmY[y]-1]}`,'']});
  const rep=years.filter(y=>VENTAS.some(v=>+v.anio===y));
  return {msg:`Archivo con ${years.length} años (${years.join(', ')}) y ${docs.length} registros.${rep.length?` Reemplazará los datos ya cargados de ${rep.join(', ')}.`:''}`,warn,docs,years,head:['Año','Canales','Total','Meses',''],preview};
}
async function vSave(docs,years){
  const ids=new Set(docs.map(d=>d.id)),now=new Date().toISOString();
  const rows=docs.map(d=>({col:'ventas',id:d.id,data:d.data,updated_at:now}));
  for(let i=0;i<rows.length;i+=200){const r=await sb.from('registros').upsert(rows.slice(i,i+200));if(r.error)throw r.error}
  const stale=VENTAS.filter(v=>years.includes(+v.anio)&&!ids.has(v.id)).map(v=>v.id);
  if(stale.length){const r=await sb.from('registros').delete().eq('col','ventas').in('id',stale);if(r.error)throw r.error}
  /* guardar una versión completa de la facturación tal como queda después de esta carga */
  const filas=[...VENTAS.filter(v=>!years.includes(+v.anio)),...docs.map(d=>({...d.data}))].map(r=>({anio:+r.anio,canal:r.canal,meses:r.meses||[]}));
  const vid='eiu-'+Date.now().toString(36);
  const h=await sb.from('registros').upsert({col:'ventas_hist',id:vid,data:{periodo:'Carga de '+years.join(', '),anios:years,cargadoEn:now,actualizado:now.slice(0,10),creadoPor:actorId(),filas},updated_at:now});
  if(h.error)toast('Datos guardados, pero no se pudo guardar la versión en el historial: '+h.error.message);
  delete REPV.eiu;db.reloadAll();
}
async function vDeleteYear(y){
  const ids=VENTAS.filter(v=>+v.anio===+y).map(v=>v.id);if(!ids.length)return;
  const r=await sb.from('registros').delete().eq('col','ventas').in('id',ids);if(r.error)throw r.error;db.reloadAll();
}
function vExport(){
  const out=[['anio','mes','canal','codigo','monto']];
  VENTAS.slice().sort((a,b)=>a.anio-b.anio||vRank(a.canal)-vRank(b.canal)).forEach(r=>(r.meses||[]).forEach((v,i)=>{if(v!=null)out.push([r.anio,i+1,r.canal,r.codigo||'',v])}));
  const csv='﻿'+out.map(r=>r.map(x=>/[",;\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n');
  downloads.save({filename:'ventas_por_canales.csv',data:csv,mimeType:'text/csv'});
}

function vTicks(lo,hi){if(!(hi>lo))hi=lo+1;const st0=(hi-lo)/5,mag=10**Math.floor(Math.log10(st0)),f=st0/mag,step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;

function vStack(el,rows,keys,cols,head,fmt){

  rows.forEach(r=>{let p=0,n2=0;keys.forEach(k=>{const v=r.vals[k]||0;if(v>=0)p+=v;else n2+=v});hi=Math.max(hi,p);lo=Math.min(lo,n2)});
  const tk=vTicks(lo,hi*1.1),t0=tk[0],t1=tk[tk.length-1],ml=vTextW(tk.map(vAx))+14;
  const y=v=>mt+(t1-v)/(t1-t0)*(H-mb-mt),band=(W-ml-6)/rows.length,bw=Math.min(44,band*.62);

      s+=`<rect x="${cx-bw/2}" width="${bw}" y="${Math.min(y(a),y(b))}" height="${Math.max(.5,Math.abs(y(a)-y(b)))}" fill="${cols[j]}" rx="${keys.length>1?2:4}"/>`});

  const tips=rows.map(r=>({h:head(r),l:[...keys.map((k,j)=>({c:cols[j],n:k,v:fmt(r.vals[k]),z:keys.length>3&&!r.vals[k]})).filter(l=>!l.z),...(keys.length>1?[{n:'Total',v:fmt(keys.reduce((a,k)=>a+(r.vals[k]||0),0)),b:1}]:[])]}));

}

  if(s.includes('alumno'))return 'Geb Alumno (Adultos)';if(s.includes('joven'))return 'Geb Joven';if(s.includes('juvenil'))return 'Geb Juveniles';

function vDiverge(el,rows){
  rows=rows.slice().sort((p,q)=>(q.b-q.a)-(p.b-p.a));
  const W=Math.max(300,el.clientWidth||500),rh=22,bh=13,H=rows.length*rh+8;
  const lab=r=>`${sD(r.b-r.a)} (${sP(r.a?r.b/r.a-1:null)})`;
  const lw=vTextW(rows.map(r=>r.n))*0.9+12,vw=vTextW(rows.map(lab))+8,ext=Math.max(1,...rows.map(r=>Math.abs(r.b-r.a)));
  const x=v=>lw+vw+(v+ext)/(2*ext)*(W-lw-2*vw);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img"><line x1="${x(0)}" x2="${x(0)}" y1="0" y2="${H}" stroke="var(--ink-2)"/>`;
  rows.forEach((r,i)=>{const d=r.b-r.a,y=4+i*rh,up=d>=0;
    s+=`<text x="${lw-8}" y="${y+bh-2}" text-anchor="end" style="fill:var(--ink)">${esc(r.n)}</text><rect x="${Math.min(x(0),x(d))}" y="${y}" width="${Math.max(1.5,Math.abs(x(d)-x(0)))}" height="${bh}" rx="3" fill="${up?'var(--ok)':'var(--bad)'}" fill-opacity=".6"/><text x="${up?x(d)+6:x(d)-6}" y="${y+bh-2}" text-anchor="${up?'start':'end'}">${lab(r)}</text><rect x="0" y="${y-3}" width="${W}" height="${rh}" fill="transparent" data-ti="${i}"/>`});
  el.innerHTML=s+'</svg><div class="vtip" hidden></div>';
  const tips=rows.map(r=>({h:r.n,l:[{n:'Anterior',v:sN(r.a)},{n:'Nuevo sin Inglés',v:sN(r.b)},{n:'Diferencia',v:lab(r),b:1}]}));
  vHover(el,tips,ev=>ev.target.dataset&&ev.target.dataset.ti!=null?+ev.target.dataset.ti:null);
}

  if((P.guias||[]).length)h+=`<div class="panel"><h2 style="font-size:1.05rem">Guías de estudio 2026–2027: calendario</h2><div class="note">Las Uniones entregan las cartas de presidentes (Unión Sur y Norte) y la publicidad de departamentos (Unión Sur, Norte y ACES); luego se autoriza la impresión y Producción entrega a APT para su distribución.</div><div class="tbl vt"><table><thead><tr><th>Trimestre</th><th>Cartas y publicidad</th><th>Autorización para impresión</th><th>Entrega de Producción a APT</th></tr></thead><tbody>${P.guias.map(g=>`<tr><td>${esc(g.trimestre)}</td><td>${esc(g.desde)}</td><td>${esc(g.autorizacion)}</td><td>${esc(g.entrega_apt)}</td></tr>`).join('')}</tbody></table></div></div>`;

}

/* ===== Informe comercial ACES (mismo modelo que ventas por canales) ===== */
