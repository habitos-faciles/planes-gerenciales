  const cv=chs.filter(o=>o.v!=null).sort((p,q)=>q.v-p.v),sube=cv.length&&cv[0].v>0?cv[0]:null,baja=cv.length&&cv[cv.length-1].v<0?cv[cv.length-1]:null;
  h+=T==null?`<p class="vlead">${y} tiene datos hasta ${V_MESL[(M.maxMes[y]||1)-1]}. Elige un mes de corte hasta ese mes para ver el acumulado.</p>`
   :`<p class="vlead">A ${mesL} de ${y}, la venta acumulada suma <b>${vM(T)}</b>${Tp!=null?` (<b class="${vCls(vVar(T,Tp))}">${vP(vVar(T,Tp))}</b> frente a ${y-1})`:''}.${chs[0]?` El canal de mayor venta es ${esc(chs[0].k)}, con <b>${vP1(chs[0].a/T)}</b> del total.`:''}${sube?` El que más crece es ${esc(sube.k)} (<b class="v-up">${vP(sube.v)}</b>)`:''}${baja?`${sube?' y el':' El'} que más cae es ${esc(baja.k)} (<b class="v-down">${vP(baja.v)}</b>)`:''}${sube||baja?'.':''}</p>`;
  h+=`<div class="kpis"><div class="kpi"><span class="l">Total acumulado · ${per}</span><span class="v">${vM(T)}</span><span class="s"><span class="${vCls(vVar(T,Tp))}">${vP(vVar(T,Tp))}</span> vs ${y-1} (${vM(Tp)})</span></div></div>`;
  if(chs.length)h+=`<div class="panel"><h2 style="font-size:1.05rem">Venta por canal · ${per}</h2><div class="note">Acumulado de cada canal, su peso en el total y la variación contra el mismo periodo del año anterior.</div>

  const keys=af.canal==='Todos'?M.canales:[af.canal];
  const lg=keys.map(k=>`<span><i style="background:${keys.length>1?vColor(k,M):'var(--cyan)'}"></i>${esc(k)}</span>`).join('');
  const ylg=[...M.years].reverse().map(x=>`<span style="${x===y?'font-weight:600;color:var(--ink)':''}"><i style="background:${vYearCol(x,M.years)}"></i>${x}</span>`).join('');
  const cnote=af.canal==='Todos'?'':` Canal: ${esc(af.canal)}.`;

  const yrsB=M.years.filter(x=>M.acum(x,'Todos',c)!=null);
  h+=`<h3 style="margin-top:6px">Comparativo acumulado enero–${mesL} de todos los años</h3>
   <div class="panel"><h2 style="font-size:1.05rem">Total acumulado enero–${mesL} por año</h2><div class="note">La línea punteada es el promedio de los años anteriores; debajo de cada año, la variación frente al año anterior.</div><div class="vchart" id="avcComp"></div></div>

   <div class="panel"><h2 style="font-size:1.05rem">Acumulado mes a mes por año</h2><div class="note">Cómo se va formando la venta del año; la línea punteada marca el mes de corte.${cnote}</div><div class="legend">${ylg}</div><div class="vchart" id="avcAcumL"></div></div></div>`;

  const rowsAll=[...M.canales,'Todos'];
  const yrsC=M.years.filter(x=>M.acum(x,'Todos',c)!=null),[yp,yl]=yrsC.slice(-2);
  const yv=M.years.filter((x,i)=>i>0&&rowsAll.some(k=>vVar(M.acum(x,k,c),M.acum(M.years[i-1],k,c))!=null));
  h+=`<div class="panel"><h2 style="font-size:1.05rem">Cuadro acumulado enero–${mesL} por canal</h2><div class="note">Soles. Junto a cada año, su variación frente al año anterior en el mismo periodo.</div>
   <div class="tbl vt"><table><thead><tr><th>Canal</th>${M.years.map(x=>`<th class="num">${x}</th>${yv.includes(x)?`<th class="num">Var. ${String(x).slice(2)}/${String(x-1).slice(2)}</th>`:''}`).join('')}<th class="num">${yl?`Part. ${yl}`:'Part.'}</th></tr></thead><tbody>${rowsAll.map(k=>
    `<tr class="${k==='Todos'?'vtot':''}"><td>${esc(vLabel(k))}</td>${M.years.map((x,i)=>{const a=M.acum(x,k,c);let td=`<td class="num">${vN(a)}</td>`;if(yv.includes(x)){const v=vVar(a,M.acum(M.years[i-1],k,c));td+=`<td class="num ${vCls(v)}">${vP(v)}</td>`}return td}).join('')}<td class="num">${vP1(yl&&M.acum(yl,k,c)!=null&&M.acum(yl,'Todos',c)?M.acum(yl,k,c)/M.acum(yl,'Todos',c):null)}</td></tr>`).join('')}</tbody></table></div></div>`;

  const comp=M.years.filter(x=>M.maxMes[x]===12),cl=comp[comp.length-1],cp=comp.includes(cl-1)?cl-1:comp[comp.length-2];
  const base=comp.includes(2022)?2022:comp[0],totCl=cl?M.anual(cl,'Todos'):null;
  h+=`<h3 style="margin-top:6px">Comparativo anual</h3>
   <div class="panel"><h2 style="font-size:1.05rem">Venta anual por año</h2><div class="note">El año que aún no cierra va con asterisco.${cnote}</div><div class="legend">${lg}</div><div class="vchart" id="avcAnual"></div></div>

   <div class="tbl vt"><table><thead><tr><th>Canal</th>${M.years.map(x=>`<th class="num">${M.maxMes[x]<12?`${x} (a ${V_MES[M.maxMes[x]-1].toLowerCase()}.)`:x}</th>`).join('')}${cl&&cp?`<th class="num">Var. ${cl}/${cp}</th>`:''}${cl?`<th class="num">Part. ${cl}</th>`:''}${cl&&base&&cl>base?`<th class="num">Crec. prom. ${base}–${cl}</th>`:''}</tr></thead><tbody>${rowsAll.map(k=>{
    const a=cl?M.anual(cl,k):null,b=cp?M.anual(cp,k):null,z=base?M.anual(base,k):null,v=vVar(a,b),g=a>0&&z>0&&cl>base?Math.pow(a/z,1/(cl-base))-1:null;

  h+=`<h3 style="margin-top:6px">Comparativo mensual</h3>

const REP_TIT={eiu:'INFORME FACTURACIÓN EIU',susc:'COMPARATIVO SUSCRIPCIONES',prod:'INFORME DE PRODUCCIÓN',aces:'INFORME FACTURACIÓN ACES',soma:'INFORME DE SOMA',cap:'INFORME DE CAPELLANÍA',apt:'INFORME DE APT',jv:'INFORME JEFATURA VENTAS EIU',dis:'INFORME DISEÑO',mant:'INFORME MANTENIMIENTO',aden:'INFORME DENOMINACIONAL ACES',edu:'INFORME EDUCACIÓN ACES',upn:'INFORME UPN MATERIAL IGLESIAS'};
function printRepSection(key){
  const head=document.getElementById('rep-'+key);if(!head){toast('No se encontró la sección.');return}
  const nodes=[];let n=head.nextElementSibling;
  while(n&&!n.classList.contains('rep-sec')&&!(n.querySelector&&n.querySelector(':scope > .rep-sec'))){nodes.push(n);n=n.nextElementSibling}
  const arr=key==='eiu'?VHIST:REP_ARR()[key]||[];const cur=key==='eiu'?(VHIST.find(x=>x.id===REPV.eiu)||null):pickDoc(key,arr);
  const ver=key==='eiu'?(cur?`Versión: carga del ${vFmtDT(vTime(cur))}`:'Versión: datos vigentes'):(cur?`Versión: ${vFmtDT(vTime(cur))} · ${cur.periodo||''}`:'');
  document.getElementById('repPrintBox')?.remove();document.getElementById('repPrintCss')?.remove();
  const st=document.createElement('style');st.id='repPrintCss';
  st.textContent=`@page{size:A4 landscape;margin:9mm}
   @media screen{#repPrintBox{display:none}}
   @media print{body>*:not(#repPrintBox){display:none!important}#repPrintBox{display:block;font-size:9pt}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #repPrintBox .vver-bar,#repPrintBox button,#repPrintBox input[type=file]{display:none!important}
    #repPrintBox .panel,#repPrintBox .kpi,#repPrintBox .card,#repPrintBox tr{break-inside:avoid;page-break-inside:avoid}
    #repPrintBox .panel{box-shadow:none!important;margin:0 0 8px}
    #repPrintBox .tbl,#repPrintBox .vt{overflow:visible!important;max-height:none!important}
    #repPrintBox table{font-size:7.5pt}
    #repPrintBox .grid2{grid-template-columns:1fr 1fr!important}
    #repPrintBox .rp-h{margin:0 0 2px;font-size:15pt}#repPrintBox .rp-s{color:#555;font-size:8pt;margin:0 0 8px}}`;
  document.head.appendChild(st);
  const box=document.createElement('div');box.id='repPrintBox';
  box.innerHTML=`<h1 class="rp-h">${esc(REP_TIT[key]||head.textContent)}</h1><div class="rp-s">Planes Gerenciales de la Editorial · Reportes · ${esc(ver)} · Impreso el ${fdate(today())}${myAcc()?' por '+esc(myAcc().nombre):''}</div>`;
  nodes.forEach(x=>{const c=x.cloneNode(true);c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    /* conservar lo elegido en los filtros */
    const sa=x.querySelectorAll('select'),sb2=c.querySelectorAll('select');sa.forEach((s,i)=>{if(sb2[i])sb2[i].value=s.value;const o=sb2[i]&&sb2[i].options[s.selectedIndex];if(o)o.setAttribute('selected','')});
    box.appendChild(c)});
  document.body.appendChild(box);
  const clean=()=>{box.remove();st.remove();window.removeEventListener('afterprint',clean)};
  window.addEventListener('afterprint',clean);
  setTimeout(()=>window.print(),80);
}

/* ===== Conexión con Supabase (datos, archivos, descargas) ===== */
function makeDb(){
  const subs={};const cache={};
  async function fetchCol(c){let all=[],from=0;for(;;){const r=await sb.from('registros').select('id,data').eq('col',c).range(from,from+999);if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)break;from+=1000}cache[c]=new Map(all.map(x=>[x.id,x.data]));emit(c)}
  function emit(c){const docs=[...(cache[c]||new Map()).entries()].map(([id,data])=>({id,exists:true,data:()=>data}));(subs[c]||[]).forEach(fn=>fn({docs,size:docs.length,empty:!docs.length}))}
  function applyLocal(c,id,data){if(!cache[c])cache[c]=new Map();if(data)cache[c].set(id,data);else cache[c].delete(id);emit(c)}
  const doc=(c,id)=>({
    async set(obj){const r=await sb.from('registros').upsert({col:c,id,data:obj,updated_at:new Date().toISOString()});if(r.error)throw {code:'invalid_argument',message:r.error.message};applyLocal(c,id,obj)},
    async update(patch){const cur=(cache[c]&&cache[c].get(id))||{};return this.set({...cur,...patch})},
    async delete(){const r=await sb.from('registros').delete().eq('col',c).eq('id',id);if(r.error)throw {code:'invalid_argument',message:r.error.message};applyLocal(c,id,null)}
  });
  let channel=null;
  function startRealtime(){
    if(channel)return;
    channel=sb.channel('registros-cambios').on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
      const row=p.new&&p.new.col?p.new:p.old;if(!row||!row.col)return;
      if(p.eventType==='DELETE'){if(row.id)applyLocal(row.col,row.id,null);else fetchCol(row.col).catch(()=>{})}
      else applyLocal(row.col,row.id,row.data);
    }).subscribe();
    setInterval(()=>{if(SESSION)Object.keys(subs).forEach(c=>fetchCol(c).catch(()=>{}))},60000);
  }
  return {
    collection:c=>({doc:id=>doc(c,id),onSnapshot(fn,err){(subs[c]=subs[c]||[]).push(fn);fetchCol(c).catch(e=>err&&err({code:'unavailable',message:e.message}));startRealtime();return ()=>{subs[c]=subs[c].filter(f=>f!==fn)}}}),
    doc:path=>{const [c,id]=path.split('/');return doc(c,id)},
    reloadAll(){Object.keys(subs).forEach(c=>fetchCol(c).catch(()=>{}))},
    clear(){Object.keys(cache).forEach(c=>{cache[c]=new Map();emit(c)})}
  };
}
const webDownloads={async save({filename,data,mimeType}){const blob=data instanceof Blob?data:new Blob([data],{type:mimeType||'application/octet-stream'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'}}};
const webAssets={async upload(file,{type}={}){const safe=(file.name||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_');const path=`${new Date().getFullYear()}/${uid()}-${safe}`;
  const r=await sb.storage.from('evidencias').upload(path,file,{contentType:type||file.type||'application/octet-stream',upsert:false});if(r.error)throw {code:/size|large/i.test(r.error.message)?'too_large':'upstream_error',message:r.error.message};return {id:path,url:'',sizeBytes:file.size,contentType:type||file.type}}};
async function openEvidence(path){const w=window.open('','_blank');const r=await sb.storage.from('evidencias').createSignedUrl(path,600);if(r.error||!r.data){if(w)w.close();toast('No se pudo abrir el archivo.');return}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-evopen]');if(a){e.preventDefault();openEvidence(a.dataset.evopen)}});
